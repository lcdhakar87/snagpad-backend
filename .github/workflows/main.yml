name: demo CICD with action
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Run Unit Tests
      run: mvn test
      
    - name: Build with Maven
      run: mvn clean install -DskipTests 
      
    # 1. AWS Credentials Login
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    # 2. AWS ECR Login
    - name: Log in to Amazon ECR
      id: login-aws-ecr
      uses: aws-actions/amazon-ecr-login@v2
      
    # 3. Image Build & Push to ECR
    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-aws-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        IMAGE_TAG: latest
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        
    # 4. SSH into EC2 and Deploy Container
    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # 1. AWS Credentials Export Karein Runner Se
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AWS_DEFAULT_REGION="${{ secrets.AWS_REGION }}"

          # 2. ECR Login
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-aws-ecr.outputs.registry }}

          # 3. Old Container Cleanup
          docker stop my-java-app || true
          docker rm my-java-app || true

          # 4. Pull & Run
          docker pull ${{ steps.login-aws-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest
          docker run -d -p 8080:8080 --name my-java-app ${{ steps.login-aws-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest
